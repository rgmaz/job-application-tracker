services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jat
    restart: unless-stopped

    # SQLite is a single-writer database; do not scale this service.
    volumes:
      - ./data:/data

    environment:
      DATA_DIR: /data
      PORT: 8080
      TZ: Africa/Harare
      BASE_URL: http://localhost:8080
      AUTH_DISABLED: "false"

    # Bound to loopback: safe behind an existing TLS reverse proxy on the
    # same host. Change to 0.0.0.0:8080 only if you intend to expose it.
    ports:
      - "127.0.0.1:8080:8080"

    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
