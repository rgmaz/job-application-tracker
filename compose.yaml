services:
  app:
    build: .
    image: jat:latest
    restart: unless-stopped
    # Run as the host user so the bind-mounted ./data is writable.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: "${TZ:-Africa/Harare}"
      DATA_DIR: /data
      BIND_ADDR: 0.0.0.0
      PORT: "8080"
      BASE_URL: "${BASE_URL:-http://localhost:8080}"
      AUTH_DISABLED: "${AUTH_DISABLED:-false}"
      TRUST_PROXY_AUTH: "${TRUST_PROXY_AUTH:-false}"
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-720}"
    volumes:
      - ./data:/data
