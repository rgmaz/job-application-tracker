{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{with .Title}}{{.}} · {{end}}Job Application Tracker</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><a href="/" aria-label="Home"><strong>Job Tracker</strong></a></li>
      </ul>
      <ul>
        <li><a href="/applications"{{if eq .Nav "applications"}} aria-current="page"{{end}}>Applications</a></li>
        <li><a href="/dashboard"{{if eq .Nav "dashboard"}} aria-current="page"{{end}}>Dashboard</a></li>
        <li><a href="/settings"{{if eq .Nav "settings"}} aria-current="page"{{end}}>Settings</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {{template "flash" .}}
    {{block "content" .}}<p>Nothing to show yet.</p>{{end}}
  </main>
  <footer class="container">
    <small>Self-hosted job application tracker</small>
  </footer>
</body>
</html>{{end}}
